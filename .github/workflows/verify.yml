name: Verify SDK

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Build and verify all LGPL/GPL SDK packages
        required: true
        type: boolean
        default: false
      diagnostic_macos:
        description: Restrict a temporary diagnostic run to macOS jobs
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fast-tests:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Run lightweight contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  windows-sdk:
    if: github.event_name == 'workflow_dispatch' && inputs.full && !inputs.diagnostic_macos
    runs-on: windows-2022
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        profile: [lgpl, gpl]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        id: msys2
        with:
          msystem: MSYS
          release: false
          update: false
          install: make diffutils
      - name: Install hash-verified NASM 3.02
        shell: powershell
        run: |
          $url = 'https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-installer-x64.exe'
          $expected = '0DDB40310861EB29F4D649FEB9466779982A2D251C0DB2B9CF0D21CF591171F3'
          $installer = Join-Path $env:RUNNER_TEMP 'nasm-3.02-installer-x64.exe'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $installer
          $observed = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash
          if ($observed -ne $expected) {
            throw "NASM installer SHA-256 mismatch: $observed"
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "NASM installer failed: $($process.ExitCode)"
          }
      - name: Build and verify Windows SDK
        shell: powershell
        env:
          LARIX_MSYS2_BASH: ${{ steps.msys2.outputs.msys2-location }}/usr/bin/bash.exe
          LARIX_MSYS2_MAKE: ${{ steps.msys2.outputs.msys2-location }}/usr/bin/make.exe
          LARIX_MSYS2_CMP: ${{ steps.msys2.outputs.msys2-location }}/usr/bin/cmp.exe
        run: ./scripts/build-windows.ps1 -Profile ${{ matrix.profile }} -Configuration Release -OutputRoot build/windows-${{ matrix.profile }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-x64-msvc-${{ matrix.profile }}
          path: build/windows-${{ matrix.profile }}/package/*.zip
          if-no-files-found: error
          retention-days: 1

  macos-sdk:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: macos-15
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        profile: [lgpl, gpl]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Build and verify macOS arm64 SDK
        run: ./scripts/build-macos.sh --profile ${{ matrix.profile }} --configuration Release --output-root build/macos-${{ matrix.profile }}
      - name: Diagnose embedded macOS build path
        if: failure()
        shell: bash
        run: |
          binary="build/macos-${{ matrix.profile }}/stage/bin/ffprobe"
          build_root="$PWD/build/macos-${{ matrix.profile }}/build"
          [[ -f "$binary" ]] || exit 0
          python3 - "$binary" "$build_root" <<'PY'
          import pathlib
          import sys

          payload = pathlib.Path(sys.argv[1]).read_bytes()
          value = sys.argv[2]
          for encoding in ("utf-8", "utf-16le"):
              offset = payload.find(value.encode(encoding))
              print(f"exact {encoding} offset: {offset}")
          for phase in (0, 1):
              even_length = (len(payload) - phase) & ~1
              decoded = payload[phase:phase + even_length].decode(
                  "utf-16le", errors="ignore"
              )
              index = decoded.casefold().find(value.casefold())
              print(f"casefold utf-16le phase {phase} character offset: {index}")

          import struct
          magic, _, _, _, command_count, _, _, _ = struct.unpack_from(
              "<IiiIIIII", payload, 0
          )
          if magic != 0xFEEDFACF:
              raise SystemExit("unexpected Mach-O magic")
          target_offset = payload.find(value.encode("utf-8"))
          command_offset = 32
          for _ in range(command_count):
              command, command_size = struct.unpack_from(
                  "<II", payload, command_offset
              )
              if command == 0x19:
                  segment = struct.unpack_from(
                      "<II16sQQQQiiII", payload, command_offset
                  )
                  section_count = segment[-2]
                  section_offset = command_offset + 72
                  for _ in range(section_count):
                      section = struct.unpack_from(
                          "<16s16sQQIIIIIIII", payload, section_offset
                      )
                      name = section[0].split(b"\0", 1)[0].decode("ascii")
                      segment_name = section[1].split(b"\0", 1)[0].decode("ascii")
                      size = section[3]
                      file_offset = section[4]
                      if file_offset <= target_offset < file_offset + size:
                          print(f"matching section: {segment_name},{name}")
                      section_offset += 80
              command_offset += command_size
          PY
          python3 - "$PWD/build/macos-${{ matrix.profile }}/build/ffbuild/config.mak" "$build_root" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          build_root = sys.argv[2]
          print(f"config CFLAGS contain absolute build map: {-1 != text.find('-ffile-prefix-map=' + build_root + '=larix-build')}")
          print(f"config CFLAGS contain stable compilation dir: {'-fdebug-compilation-dir=larix-build' in text}")
          PY
          echo "::group::matching strings"
          strings -a -t x "$binary" | grep -F -C 3 "$build_root" || true
          echo "::endgroup::"
          echo "::group::Mach-O load commands"
          otool -l "$binary" | grep -F -C 6 "$build_root" || true
          echo "::endgroup::"
          echo "::group::DWARF info"
          xcrun dwarfdump --debug-info "$binary" | grep -F -C 6 "$build_root" || true
          echo "::endgroup::"
          echo "::group::DWARF line table"
          xcrun dwarfdump --debug-line "$binary" | grep -F -C 6 "$build_root" || true
          echo "::endgroup::"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-arm64-${{ matrix.profile }}
          path: build/macos-${{ matrix.profile }}/package/*.tar.xz
          if-no-files-found: error
          retention-days: 1
