name: Verify SDK

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Build and verify all LGPL/GPL SDK packages
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fast-tests:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Run lightweight contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  windows-sdk:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: windows-2022
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        profile: [lgpl, gpl]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install hash-verified NASM 3.02
        shell: powershell
        run: |
          $url = 'https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-installer-x64.exe'
          $expected = '0DDB40310861EB29F4D649FEB9466779982A2D251C0DB2B9CF0D21CF591171F3'
          $installer = Join-Path $env:RUNNER_TEMP 'nasm-3.02-installer-x64.exe'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $installer
          $observed = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash
          if ($observed -ne $expected) {
            throw "NASM installer SHA-256 mismatch: $observed"
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "NASM installer failed: $($process.ExitCode)"
          }
      - name: Build and verify Windows SDK
        shell: powershell
        run: ./scripts/build-windows.ps1 -Profile ${{ matrix.profile }} -Configuration Release -OutputRoot build/windows-${{ matrix.profile }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-x64-msvc-${{ matrix.profile }}
          path: build/windows-${{ matrix.profile }}/package/*.zip
          if-no-files-found: error
          retention-days: 1

  macos-sdk:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: macos-15
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        profile: [lgpl, gpl]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build and verify macOS arm64 SDK
        run: ./scripts/build-macos.sh --profile ${{ matrix.profile }} --configuration Release --output-root build/macos-${{ matrix.profile }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-arm64-${{ matrix.profile }}
          path: build/macos-${{ matrix.profile }}/package/*.tar.xz
          if-no-files-found: error
          retention-days: 1
